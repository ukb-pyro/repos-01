<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Ukubona — Continuous Tuning System</title>
<style>
  body {
    margin: 0;
    background: #0f172a;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    color: #e5e7eb;
  }
  .title {
    text-align: center;
    padding: 20px;
    font-size: 22px;
    font-weight: 600;
  }
  svg {
    width: 100%;
    height: 90vh;
  }
  .box {
    fill: #1e293b;
    stroke: #38bdf8;
    stroke-width: 1.5;
    rx: 10;
  }
  .ukubona {
    fill: #022c22;
    stroke: #34d399;
    stroke-width: 2;
  }
  .text {
    fill: #e5e7eb;
    font-size: 13px;
    text-anchor: middle;
    dominant-baseline: middle;
  }
  .label {
    fill: #94a3b8;
    font-size: 11px;
    text-anchor: middle;
  }
  .arrow {
    stroke: #64748b;
    stroke-width: 1.5;
    marker-end: url(#arrow);
  }
  .highlight {
    stroke: #f59e0b;
    stroke-width: 2;
    stroke-dasharray: 4;
  }
</style>
</head>

<body>

<div class="title">
🎼 Ukubona — Continuous Tuning for Health Systems
</div>

<svg viewBox="0 0 1000 600">

  <!-- Arrow Definition -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Reality -->
  <rect x="50" y="220" width="140" height="60" class="box"/>
  <text x="120" y="250" class="text">Reality</text>
  <text x="120" y="275" class="label">Patients • Staff • Workload</text>

  <!-- Instruments -->
  <rect x="240" y="220" width="140" height="60" class="box"/>
  <text x="310" y="250" class="text">Instruments</text>
  <text x="310" y="275" class="label">DHIS2 • eHMIS</text>

  <!-- Compression -->
  <rect x="430" y="220" width="160" height="60" class="box highlight"/>
  <text x="510" y="250" class="text">Compression</text>
  <text x="510" y="275" class="label">Forms • Indicators</text>

  <!-- Output -->
  <rect x="640" y="220" width="140" height="60" class="box"/>
  <text x="710" y="250" class="text">KPIs</text>
  <text x="710" y="275" class="label">Coverage • Completeness</text>

  <!-- Ukubona Layer -->
  <rect x="430" y="350" width="160" height="80" class="ukubona"/>
  <text x="510" y="380" class="text">Ukubona</text>
  <text x="510" y="405" class="label">Detect Distortion</text>
  <text x="510" y="420" class="label">Estimate Loss</text>

  <!-- SIB-GAP -->
  <rect x="640" y="350" width="140" height="80" class="ukubona"/>
  <text x="710" y="380" class="text">SIB-GAP</text>
  <text x="710" y="405" class="label">Recommend Fix</text>

  <!-- UI Layer -->
  <rect x="240" y="350" width="140" height="80" class="ukubona"/>
  <text x="310" y="380" class="text">Selena UI</text>
  <text x="310" y="405" class="label">Sliders / Control</text>

  <!-- Arrows Top Row -->
  <line x1="190" y1="250" x2="240" y2="250" class="arrow"/>
  <line x1="380" y1="250" x2="430" y2="250" class="arrow"/>
  <line x1="590" y1="250" x2="640" y2="250" class="arrow"/>

  <!-- Down to Ukubona -->
  <line x1="510" y1="280" x2="510" y2="350" class="arrow"/>

  <!-- Ukubona to SIB -->
  <line x1="590" y1="390" x2="640" y2="390" class="arrow"/>

  <!-- SIB to UI -->
  <line x1="640" y1="390" x2="380" y2="390" class="arrow"/>

  <!-- UI back to Instruments -->
  <line x1="310" y1="350" x2="310" y2="280" class="arrow"/>

  <!-- Loop Label -->
  <text x="500" y="500" class="label">
    Continuous Tuning Loop: Measure → Detect → Adjust → Repeat
  </text>

</svg>

</body>
</html>
